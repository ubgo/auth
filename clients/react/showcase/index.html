<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Every component of the ubgo/auth React kit, live against a mock server, with its shadcn install line and a usage snippet." />
    <title>ubgo/auth React kit</title>
    <script>
      // Apply the theme before first paint, so dark mode never flashes light.
      try {
        const saved = localStorage.getItem("theme")
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
