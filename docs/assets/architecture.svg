<svg viewBox="0 0 820 814" width="820" xmlns="http://www.w3.org/2000/svg">
  <title>ubgo/auth architecture</title>
  <desc>Layer stack of github.com/ubgo/auth: callers, transports, the operation pipeline, the core and storage, with a numbered sign-in request going down and the session coming back up, and the plugin column beside them.</desc>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>
  <!-- White canvas, so the diagram reads as a light card on both GitHub themes. -->
  <rect x="0" y="0" width="820" height="814" fill="#ffffff"/>
  <text x="410" y="34" font-size="16" fill="#1e293b" text-anchor="middle">ubgo/auth: one operation pipeline behind every entry point</text>
  <rect x="22" y="50" width="554" height="95" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="64" font-size="11" fill="#64748b">Callers</text>
  <rect x="22" y="185" width="554" height="95" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="199" font-size="11" fill="#64748b">Transports: each one calls the same operation</text>
  <rect x="22" y="320" width="554" height="95" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="334" font-size="11" fill="#64748b">Operation pipeline: every auth.Define[In, Out] runs through these steps</text>
  <rect x="22" y="455" width="554" height="174" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="469" font-size="11" fill="#64748b">Core (package auth): tables, migrations, swappable interfaces in purple</text>
  <rect x="22" y="669" width="554" height="95" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="683" font-size="11" fill="#64748b">Storage</text>
  <rect x="606" y="185" width="192" height="579" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="616" y="199" font-size="11" fill="#64748b">Plugins (opt-in)</text>
  <path d="M62,150 L 62,174" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M92,180 L 92,156" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M62,285 L 62,309" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M92,315 L 92,291" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M62,420 L 62,444" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M92,450 L 92,426" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M62,634 L 62,658" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M92,664 L 92,640" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M154,372 L 163,372" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,372 L 299,372" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M426,372 L 435,372" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M198,721 L 210,721" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M601,367 L 587,367" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M601,542 L 587,542" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="106" y="168.5" font-size="10" fill="#1e40af">① POST /password/sign-in</text>
  <text x="300" y="168.5" font-size="10" fill="#166534">⑧ Set-Cookie: __Host-auth_session</text>
  <text x="106" y="303.5" font-size="10" fill="#1e40af">② invoke the operation</text>
  <text x="300" y="303.5" font-size="10" fill="#166534">⑦ effects: issue the session</text>
  <text x="106" y="438.5" font-size="10" fill="#1e40af">③ check password, create session</text>
  <text x="300" y="438.5" font-size="10" fill="#166534">⑥ session and token</text>
  <text x="106" y="652.5" font-size="10" fill="#1e40af">④ sqlb INSERT auth_session</text>
  <text x="300" y="652.5" font-size="10" fill="#166534">⑤ row stored</text>
  <rect x="38" y="75" width="155" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="115.5" y="97" font-size="12" fill="#1e40af" text-anchor="middle">Browser</text>
  <text x="115.5" y="115" font-size="10" fill="#1e40af" text-anchor="middle">cookie session</text>
  <rect x="221" y="75" width="155" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="298.5" y="97" font-size="12" fill="#1e40af" text-anchor="middle">Mobile app · CLI</text>
  <text x="298.5" y="115" font-size="10" fill="#1e40af" text-anchor="middle">bearer token</text>
  <rect x="404" y="75" width="155" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="481.5" y="97" font-size="12" fill="#1e40af" text-anchor="middle">Your Go code</text>
  <text x="481.5" y="115" font-size="10" fill="#1e40af" text-anchor="middle">handlers, jobs, tools</text>
  <rect x="38" y="210" width="155" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="115.5" y="232" font-size="12" fill="#b45309" text-anchor="middle">authhttp</text>
  <text x="115.5" y="250" font-size="10" fill="#b45309" text-anchor="middle">net/http · chi · authui</text>
  <rect x="221" y="210" width="155" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="298.5" y="232" font-size="12" fill="#b45309" text-anchor="middle">contrib adapters</text>
  <text x="298.5" y="250" font-size="10" fill="#b45309" text-anchor="middle">gin, echo, fiber, gqlgen</text>
  <rect x="404" y="210" width="155" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="481.5" y="232" font-size="12" fill="#b45309" text-anchor="middle">Go API</text>
  <text x="481.5" y="250" font-size="10" fill="#b45309" text-anchor="middle">op.Call(ctx, in)</text>
  <rect x="38" y="345" width="111" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="93.5" y="367" font-size="12" fill="#b45309" text-anchor="middle">Rate limit</text>
  <text x="93.5" y="385" font-size="10" fill="#b45309" text-anchor="middle">IP · origin check</text>
  <rect x="174" y="345" width="111" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="229.5" y="367" font-size="12" fill="#b45309" text-anchor="middle">Session</text>
  <text x="229.5" y="385" font-size="10" fill="#b45309" text-anchor="middle">+ requirement</text>
  <rect x="310" y="345" width="111" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="365.5" y="367" font-size="12" fill="#b45309" text-anchor="middle">Handler</text>
  <text x="365.5" y="385" font-size="10" fill="#b45309" text-anchor="middle">wrapped in hooks</text>
  <rect x="446" y="345" width="111" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="501.5" y="367" font-size="12" fill="#b45309" text-anchor="middle">Effects</text>
  <text x="501.5" y="385" font-size="10" fill="#b45309" text-anchor="middle">after commit</text>
  <rect x="38" y="480" width="111" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="93.5" y="502" font-size="12" fill="#166534" text-anchor="middle">Users</text>
  <text x="93.5" y="520" font-size="10" fill="#166534" text-anchor="middle">auth_user</text>
  <rect x="174" y="480" width="111" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="229.5" y="502" font-size="12" fill="#166534" text-anchor="middle">Identities</text>
  <text x="229.5" y="520" font-size="10" fill="#166534" text-anchor="middle">auth_identity</text>
  <rect x="310" y="480" width="111" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="365.5" y="502" font-size="12" fill="#166534" text-anchor="middle">Sessions</text>
  <text x="365.5" y="520" font-size="10" fill="#166534" text-anchor="middle">auth_session</text>
  <rect x="446" y="480" width="111" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="501.5" y="502" font-size="12" fill="#166534" text-anchor="middle">Tokens</text>
  <text x="501.5" y="520" font-size="10" fill="#166534" text-anchor="middle">auth_verification</text>
  <rect x="38" y="559" width="111" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="93.5" y="581" font-size="12" fill="#6b21a8" text-anchor="middle">Sealer</text>
  <text x="93.5" y="599" font-size="10" fill="#6b21a8" text-anchor="middle">secrets at rest</text>
  <rect x="174" y="559" width="111" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="229.5" y="581" font-size="12" fill="#6b21a8" text-anchor="middle">SessionStore</text>
  <text x="229.5" y="599" font-size="10" fill="#6b21a8" text-anchor="middle">+ SessionCache</text>
  <rect x="310" y="559" width="111" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="365.5" y="581" font-size="12" fill="#6b21a8" text-anchor="middle">RateStore</text>
  <text x="365.5" y="599" font-size="10" fill="#6b21a8" text-anchor="middle">limit counters</text>
  <rect x="446" y="559" width="111" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="501.5" y="581" font-size="12" fill="#6b21a8" text-anchor="middle">Token store</text>
  <text x="501.5" y="599" font-size="10" fill="#6b21a8" text-anchor="middle">VerificationStore</text>
  <rect x="38" y="694" width="155" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="115.5" y="716" font-size="12" fill="#166534" text-anchor="middle">sqlb</text>
  <text x="115.5" y="734" font-size="10" fill="#166534" text-anchor="middle">typed SQL builder</text>
  <rect x="221" y="694" width="155" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="298.5" y="716" font-size="12" fill="#166534" text-anchor="middle">SQL database</text>
  <text x="298.5" y="734" font-size="10" fill="#166534" text-anchor="middle">SQLite · Postgres · MySQL</text>
  <rect x="404" y="694" width="155" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="481.5" y="716" font-size="12" fill="#166534" text-anchor="middle">Redis (optional)</text>
  <text x="481.5" y="734" font-size="10" fill="#166534" text-anchor="middle">sessions · cache · rates</text>
  <rect x="622" y="210" width="160" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="702" y="232" font-size="12" fill="#6b21a8" text-anchor="middle">Identifiers</text>
  <text x="702" y="250" font-size="10" fill="#6b21a8" text-anchor="middle">email · phone · username</text>
  <rect x="622" y="292" width="160" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="702" y="315" font-size="12" fill="#6b21a8" text-anchor="middle">Sign-in methods</text>
  <text x="702" y="333" font-size="10" fill="#6b21a8" text-anchor="middle">password · oauth · magiclink</text>
  <text x="702" y="348" font-size="10" fill="#6b21a8" text-anchor="middle">passkey · anonymous</text>
  <rect x="622" y="392" width="160" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="702" y="414" font-size="12" fill="#6b21a8" text-anchor="middle">Two-factor</text>
  <text x="702" y="432" font-size="10" fill="#6b21a8" text-anchor="middle">TOTP · recovery codes</text>
  <rect x="622" y="474" width="160" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="702" y="497" font-size="12" fill="#6b21a8" text-anchor="middle">Accounts</text>
  <text x="702" y="515" font-size="10" fill="#6b21a8" text-anchor="middle">organization · invite</text>
  <text x="702" y="530" font-size="10" fill="#6b21a8" text-anchor="middle">audit · terms · lastlogin</text>
  <rect x="622" y="574" width="160" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="702" y="597" font-size="12" fill="#6b21a8" text-anchor="middle">Authorization</text>
  <text x="702" y="615" font-size="10" fill="#6b21a8" text-anchor="middle">access · admin · apikey</text>
  <text x="702" y="630" font-size="10" fill="#6b21a8" text-anchor="middle">your Authorizer (policies…)</text>
  <rect x="622" y="674" width="160" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="702" y="697" font-size="12" fill="#6b21a8" text-anchor="middle">Protocols</text>
  <text x="702" y="715" font-size="10" fill="#6b21a8" text-anchor="middle">sso · scim · oauthprovider</text>
  <text x="702" y="730" font-size="10" fill="#6b21a8" text-anchor="middle">deviceauth · agentauth · jwt</text>
  <text x="410" y="790" font-size="10" fill="#64748b" text-anchor="middle">Blue: a sign-in request on its way down (1 to 4). Green: the session on its way back up (5 to 8). Purple: pluggable parts.</text>
</svg>
